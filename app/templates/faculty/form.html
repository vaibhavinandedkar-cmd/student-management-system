{% extends 'layouts/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_header %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
        <h1 class="h3 mb-1">{{ title }}</h1>
        <p class="text-muted mb-0">Add or update faculty information for academic operations.</p>
    </div>
    <a href="{{ url_for('erp.faculty') }}" class="btn btn-outline-secondary">Back to faculty</a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="post" action="{{ form_action }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Faculty Code</label>
                    <input type="text" name="faculty_code" class="form-control" value="{{ faculty.faculty_code if faculty else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" value="{{ faculty.first_name if faculty else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" value="{{ faculty.last_name if faculty else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ faculty.email if faculty else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ faculty.phone if faculty else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Designation</label>
                    <input type="text" name="designation" class="form-control" value="{{ faculty.designation if faculty else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Department</label>
                    <select name="department_id" class="form-select" required>
                        <option value="">Select department</option>
                        {% for department in departments %}
                            <option value="{{ department.id }}" {% if faculty and faculty.department_id == department.id %}selected{% endif %}>{{ department.department_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="">Choose...</option>
                        <option value="Male" {% if faculty and faculty.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if faculty and faculty.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if faculty and faculty.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Joining Date</label>
                    <input type="date" name="joining_date" class="form-control" value="{{ faculty.joining_date if faculty and faculty.joining_date else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Salary</label>
                    <input type="number" name="salary" step="0.01" class="form-control" value="{{ faculty.salary if faculty else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for status in status_options %}
                            <option value="{{ status }}" {% if faculty and faculty.status == status %}selected{% endif %}>{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save Faculty</button>
                <a href="{{ url_for('erp.faculty') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

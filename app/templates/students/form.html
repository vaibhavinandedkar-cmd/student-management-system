{% extends 'layouts/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_header %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
        <h1 class="h3 mb-1">{{ title }}</h1>
        <p class="text-muted mb-0">Use this form to manage student records and enrollment details.</p>
    </div>
    <a href="{{ url_for('erp.students') }}" class="btn btn-outline-secondary">Back to students</a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="post" action="{{ form_action }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Student Code</label>
                    <input type="text" name="student_code" class="form-control" value="{{ student.student_code if student else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" value="{{ student.first_name if student else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" value="{{ student.last_name if student else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" value="{{ student.email if student else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ student.phone if student else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="">Choose...</option>
                        <option value="Male" {% if student and student.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if student and student.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if student and student.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Department</label>
                    <select name="department_id" class="form-select" required>
                        <option value="">Select department</option>
                        {% for department in departments %}
                            <option value="{{ department.id }}" {% if student and student.department_id == department.id %}selected{% endif %}>{{ department.department_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="date_of_birth" class="form-control" value="{{ student.date_of_birth if student and student.date_of_birth else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Admission Date</label>
                    <input type="date" name="admission_date" class="form-control" value="{{ student.admission_date if student and student.admission_date else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Semester</label>
                    <input type="number" name="semester" class="form-control" value="{{ student.semester if student else '' }}" min="1" max="12">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for status in status_options %}
                            <option value="{{ status }}" {% if student and student.status == status %}selected{% endif %}>{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="3">{{ student.address if student else '' }}</textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save Student</button>
                <a href="{{ url_for('erp.students') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

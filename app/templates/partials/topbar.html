<header class="topbar bg-white border-bottom shadow-sm px-4 py-3 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary btn-sm d-xl-none" id="sidebarToggle" type="button">
            <i class="bi bi-list"></i>
        </button>
        <div>
            <h2 class="h5 mb-0">{% block page_header %}ERP Workspace{% endblock %}</h2>
            <small class="text-muted">Professional enterprise student management experience</small>
        </div>
    </div>
    <div class="topbar-tools d-flex align-items-center gap-3">
        <form class="d-none d-md-flex" action="{{ request.path }}" method="get">
            <div class="input-group input-group-sm">
                <input type="text" name="q" value="{{ request.args.get('q', '') }}" class="form-control" placeholder="Search records...">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            </div>
        </form>
        <div class="dropdown">
            <button class="btn btn-outline-secondary rounded-pill dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle me-1"></i> Admin
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i> Settings</a></li>
                <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i> Sign out</a></li>
            </ul>
        </div>
    </div>
</header>

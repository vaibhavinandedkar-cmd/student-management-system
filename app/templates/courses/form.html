{% extends 'layouts/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_header %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
        <h1 class="h3 mb-1">{{ title }}</h1>
        <p class="text-muted mb-0">Define course details and academic structure for your programs.</p>
    </div>
    <a href="{{ url_for('erp.courses') }}" class="btn btn-outline-secondary">Back to courses</a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="post" action="{{ form_action }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Course Code</label>
                    <input type="text" name="course_code" class="form-control" value="{{ course.course_code if course else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Course Name</label>
                    <input type="text" name="course_name" class="form-control" value="{{ course.course_name if course else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <select name="department_id" class="form-select" required>
                        <option value="">Select department</option>
                        {% for department in departments %}
                            <option value="{{ department.id }}" {% if course and course.department_id == department.id %}selected{% endif %}>{{ department.department_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Duration (Years)</label>
                    <input type="number" name="duration_years" class="form-control" value="{{ course.duration_years if course else '' }}" min="1">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Semesters</label>
                    <input type="number" name="total_semesters" class="form-control" value="{{ course.total_semesters if course else '' }}" min="1">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for status in status_options %}
                            <option value="{{ status }}" {% if course and course.status == status %}selected{% endif %}>{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save Course</button>
                <a href="{{ url_for('erp.courses') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
